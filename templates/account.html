
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bank Account - Project KASHI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #12355b;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            color: #12355b;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>PROJECT KASHI</h1>
        <h2>Create Bank Account</h2>

        <form method="POST" action="{{ url_for('create_account') }}">
            <label for="customer_id">Customer ID</label>
            <input type="number" id="customer_id" name="customer_id"
                   min="1" required>

            <label for="account_type">Account Type</label>
            <select id="account_type" name="account_type" required>
                <option value="">Select account type</option>
                <option value="Saving">Saving</option>
                <option value="Current">Current</option>
                <option value="Salary">Salary</option>
            </select>

            <label for="balance">Opening Balance</label>
            <input type="number" id="balance" name="balance"
                   min="0" step="0.01" value="0" required>

            <label for="branch_id">Select Bank Branch</label>
            <select id="branch_id" name="branch_id" required>
                <option value="">-- Select a Branch --</option>
                <option value="1">Kashi Main Branch - Mysuru</option>
                <option value="2">Kashi City Branch - Mangaluru</option>
            </select>


            

            <button type="submit">Create Account</button>


        </form>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}


        
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
