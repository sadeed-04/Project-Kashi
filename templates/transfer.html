<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money - Project KASHI</title>
</head>
<body>
    <h1>PROJECT KASHI</h1>
    <h2>Transfer Money</h2>

    {% if message %}
    <p role="status">{{ message }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('transfer') }}">
        <label for="source_account_number">From Account Number</label>
        <input type="text" id="source_account_number"
               name="source_account_number" required>

        <label for="destination_account_number">To Account Number</label>
        <input type="text" id="destination_account_number"
               name="destination_account_number" required>

        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount"
               min="0.01" step="0.01" required>

        <button type="submit">Transfer</button>
    </form>

    <p><a href="{{ url_for('home') }}">Back to Home</a></p>
</body>
</html>
